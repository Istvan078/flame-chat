<ion-content class="login-page">
  <!-- @if (authStore.loading()) { -->
  <!-- <div class="spinner-wrapper">
    <ion-spinner></ion-spinner>
  </div> -->
  <!-- } -->
  <!-- <div class="lang-container"> -->

  <!-- </div> -->
  <div class="login login--background">
    <div class="lang-container">
      <ion-item class="select--lang">
        <ion-select
          interface="popover"
          [(ngModel)]="lang"
          name="lang"
          (ionChange)="changeLang($event)"
        >
          <ion-icon slot="start" name="globe-outline"></ion-icon>
          <ion-select-option value="hu">{{
            'hu' | translate
          }}</ion-select-option>
          <ion-select-option value="en">{{
            'en' | translate
          }}</ion-select-option>
        </ion-select>
      </ion-item>
    </div>
    <header class="header">
      <div class="img-wrapper--logo">
        <img
          class="img-logo"
          src="/assets/icons/logo-with-text.svg"
          alt="flamechat-logo"
        />
      </div>
    </header>
    <ion-card>
      <ion-card-header>
        <ion-card-title>{{ 'auth.loginTitle' | translate }}</ion-card-title>
        <ion-card-subtitle>{{
          'auth.loginSubtitle' | translate
        }}</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <form
          class="login-form"
          (ngSubmit)="onLogin('email', loginForm)"
          #loginForm="ngForm"
        >
          <ion-input
            [placeholder]="'auth.usernameOrEmail' | translate"
            ngModel
            name="usernameOrEmail"
            fill="outline"
            label="{{ 'auth.usernameOrEmail' | translate }}"
            labelPlacement="stacked"
            required
            minlength="4"
            type="text"
            ><ion-icon slot="start" name="person-outline"></ion-icon
          ></ion-input>
          <div>
            <ion-input
              #password
              required
              name="password"
              ngModel
              minlength="6"
              [label]="'auth.password' | translate"
              labelPlacement="stacked"
              type="password"
              [placeholder]="'auth.password' | translate"
              fill="outline"
            >
              <ion-icon slot="start" name="lock-closed-outline"></ion-icon>
              <ion-button
                (click)="
                  password.type === 'password'
                    ? (password.type = 'text')
                    : (password.type = 'password')
                "
                class="btn btn--password-visible"
                slot="end"
                ><ion-icon name="eye-outline"></ion-icon
              ></ion-button>
            </ion-input>
          </div>
          <ion-button
            class="btn--login"
            [disabled]="!loginForm.valid"
            type="submit"
            >{{ 'auth.login' | translate }}</ion-button
          >
        </form>
        <div class="divider-container">
          <div></div>
          <span>or</span>
          <div></div>
        </div>
        <ion-button (click)="onLogin('google')" class="btn--google"
          ><ion-icon name="logo-google" slot="start"></ion-icon
          >{{ 'auth.continueWithGoogle' | translate }}</ion-button
        >
        <div class="to-signup-container">
          <span>{{ 'auth.noAccount' | translate }} </span>
          <a routerLink="/signup">{{ 'auth.signup' | translate }}</a>
        </div>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
